<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francesco Romano — Home</title>
    <style>
        body {
            background-color: #050505;
            background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1' fill='%23ffffff' opacity='0.4'/%3E%3Ccircle cx='150' cy='250' r='1.5' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='250' cy='100' r='1' fill='%23ffffff' opacity='0.5'/%3E%3Ccircle cx='80' cy='180' r='0.5' fill='%23ffffff' opacity='0.3'/%3E%3Ccircle cx='220' cy='190' r='2' fill='%23ffffff' opacity='0.2'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .home-container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p.description {
            font-size: 1.1rem;
            color: #a0a0a0;
            line-height: 1.8;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .enter-btn {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #f5f5f5;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-bottom: 50px;
        }

        .enter-btn:hover {
            background-color: #f5f5f5;
            color: #050505;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #f5f5f5;
        }
    </style>
</head>
<body>

    <div class="home-container">
        <header>
            <h1>Francesco Romano</h1>
            <p class="description">Catturare l'equilibrio tra luce, forme e momenti quotidiani. Questo è il mio archivio fotografico personale.</p>
        </header>

        <a href="portfolio.html" class="enter-btn">Esplora il Portfolio</a>

        <div class="social-links">
            <a href="https://instagram.com/" target="_blank">Instagram</a>
            <a href="mailto:tuamail@esempio.com">Email</a>
        </div>
    </div>

</body>
</html>

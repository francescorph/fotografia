<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francesco Romano — Portfolio</title>
    <style>
        /* Stile minimale dello sfondo e dei testi */
        body {
            background-color: #0a0a0a;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Intestazione del sito */
        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p.description {
            font-size: 1rem;
            color: #a0a0a0;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Griglia fotografica */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .gallery-item {
            overflow: hidden;
            background-color: #141414;
            aspect-ratio: 3 / 2; /* Imposta una proporzione standard per le anteprime */
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }

        .gallery-item img:hover {
            opacity: 0.8;
        }

        /* Footer */
        footer {
            margin-top: 80px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Francesco Romano</h1>
        <p class="description">Catturare l'equilibrio tra luce, forme e momenti quotidiani. Questo è il mio archivio fotografico personale.</p>
    </header>

    <main class="gallery">
        
        <div class="gallery-item">
            <img src="DSCF0078.JPG" alt="Descrizione foto 1">
        </div>
        
        <div class="gallery-item">
            <img src="DSCF0083.JPG" alt="Descrizione foto 2">
        </div>

        <div class="gallery-item">
            <img src="foto3.jpg" alt="Descrizione foto 3">
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Francesco Romano. Tutti i diritti riservati.</p>
    </footer>

</body>
</html>

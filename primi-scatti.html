<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francesco Romano — Primi Scatti</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1' fill='%23ffffff' opacity='0.4'/%3E%3Ccircle cx='150' cy='250' r='1.5' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='250' cy='100' r='1' fill='%23ffffff' opacity='0.5'/%3E%3Ccircle cx='80' cy='180' r='0.5' fill='%23ffffff' opacity='0.3'/%3E%3Ccircle cx='220' cy='190' r='2' fill='%23ffffff' opacity='0.2'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MENU HAMBURGER */
        .menu-btn {
            position: fixed;
            top: 25px;
            right: 30px;
            font-size: 30px;
            color: #f5f5f5;
            cursor: pointer;
            z-index: 100;
            transition: color 0.3s ease;
        }
        .menu-btn:hover { color: #a0a0a0; }
        .menu-overlay {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 200;
            top: 0;
            right: 0;
            background-color: rgba(5, 5, 5, 0.98);
            overflow-x: hidden;
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #a0a0a0;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .close-btn:hover { color: #f5f5f5; }
        .menu-content {
            display: flex;
            flex-direction: column;
            text-align: center;
            gap: 40px;
        }
        .menu-content a {
            text-decoration: none;
            font-size: 2rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 300;
            transition: color 0.3s ease;
        }
        .menu-content a:hover { color: #f5f5f5; }

        /* GALLERIA */
        .back-link {
            align-self: flex-start;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
            transition: color 0.3s ease;
        }
        .back-link:hover { color: #f5f5f5; }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .gallery-item {
            overflow: hidden;
            background-color: #141414;
            aspect-ratio: 3 / 2;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }
        .gallery-item img:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="menu-btn" onclick="apriMenu()">☰</div>

    <div id="menuOverlay" class="menu-overlay">
        <a href="javascript:void(0)" class="close-btn" onclick="chiudiMenu()">✕</a>
        <div class="menu-content">
            <a href="index.html">Home</a>
            <a href="portfolio.html">Le mie foto</a>
            <a href="contatti.html">Contatti</a>
        </div>
    </div>

    <a href="portfolio.html" class="back-link">&larr; Torna alle Categorie</a>

    <h1>Primi Scatti</h1>

    <main class="gallery">
        <div class="gallery-item">
            <img src="FOTO1.JPG" alt="Scatto 1">
        </div>
        <div class="gallery-item">
            <img src="FOTO2.JPG" alt="Scatto 2">
        </div>
    </main>

    <script>
        function apriMenu() { document.getElementById("menuOverlay").style.width = "100%"; }
        function chiudiMenu() { document.getElementById("menuOverlay").style.width = "0%"; }
    </script>
</body>
</html>

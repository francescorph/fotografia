<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francesco Romano — Primi Scatti</title>
    <style>
        body {
            background-color: #050505;
            background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1' fill='%23ffffff' opacity='0.4'/%3E%3Ccircle cx='150' cy='250' r='1.5' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='250' cy='100' r='1' fill='%23ffffff' opacity='0.5'/%3E%3Ccircle cx='80' cy='180' r='0.5' fill='%23ffffff' opacity='0.3'/%3E%3Ccircle cx='220' cy='190' r='2' fill='%23ffffff' opacity='0.2'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-link {
            align-self: flex-start;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #f5f5f5;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 50px;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .gallery-item {
            overflow: hidden;
            background-color: #141414;
            aspect-ratio: 3 / 2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .gallery-item img:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <a href="portfolio.html" class="back-link">&larr; Torna alle Categorie</a>

    <h1>Primi Scatti</h1>

    <main class="gallery">
        <div class="gallery-item">
            <img src="foto1.jpg" alt="Primo Scatto 1">
        </div>
        
        <div class="gallery-item">
            <img src="foto2.jpg" alt="Primo Scatto 2">
        </div>
    </main>

</body>
</html>

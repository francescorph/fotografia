<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francesco Romano — Contatti</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1' fill='%23ffffff' opacity='0.4'/%3E%3Ccircle cx='150' cy='250' r='1.5' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='250' cy='100' r='1' fill='%23ffffff' opacity='0.5'/%3E%3Ccircle cx='80' cy='180' r='0.5' fill='%23ffffff' opacity='0.3'/%3E%3Ccircle cx='220' cy='190' r='2' fill='%23ffffff' opacity='0.2'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MENU HAMBURGER */
        .menu-btn {
            position: fixed;
            top: 25px;
            right: 30px;
            font-size: 30px;
            color: #f5f5f5;
            cursor: pointer;
            z-index: 100;
            transition: color 0.3s ease;
        }
        .menu-btn:hover { color: #a0a0a0; }
        .menu-overlay {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 200;
            top: 0;
            right: 0;
            background-color: rgba(5, 5, 5, 0.98);
            overflow-x: hidden;
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #a0a0a0;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .close-btn:hover { color: #f5f5f5; }
        .menu-content {
            display: flex;
            flex-direction: column;
            text-align: center;
            gap: 40px;
        }
        .menu-content a {
            text-decoration: none;
            font-size: 2rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 300;
            transition: color 0.3s ease;
        }
        .menu-content a:hover { color: #f5f5f5; }

        /* FORM CONTATTI */
        .contact-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row input { width: 100%; }
        input, textarea {
            background: transparent;
            border: 1px solid #333;
            color: #f5f5f5;
            padding: 15px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus { border-color: #f5f5f5; }
        .submit-btn {
            background: transparent;
            color: #f5f5f5;
            border: 1px solid #f5f5f5;
            padding: 15px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #f5f5f5;
            color: #050505;
        }
    </style>
</head>
<body>

    <div class="menu-btn" onclick="apriMenu()">☰</div>

    <div id="menuOverlay" class="menu-overlay">
        <a href="javascript:void(0)" class="close-btn" onclick="chiudiMenu()">✕</a>
        <div class="menu-content">
            <a href="index.html">Home</a>
            <a href="portfolio.html">Le mie foto</a>
            <a href="contatti.html">Contatti</a>
        </div>
    </div>

    <div class="contact-container">
        <h1>Scrivimi</h1>
        
        <form class="contact-form" action="https://formsubmit.co/romanofrancesco396@gmail.com" method="POST">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="Nuovo messaggio dal tuo Portfolio!">

            <div class="form-row">
                <input type="text" name="Nome" placeholder="Nome" required>
                <input type="text" name="Cognome" placeholder="Cognome" required>
            </div>
            <input type="email" name="Email_Mittente" placeholder="La tua Email" required>
            <textarea name="Messaggio" rows="5" placeholder="Scrivi il tuo messaggio..." required></textarea>
            
            <button type="submit" class="submit-btn">Invia Messaggio</button>
        </form>
    </div>

    <script>
        function apriMenu() { document.getElementById("menuOverlay").style.width = "100%"; }
        function chiudiMenu() { document.getElementById("menuOverlay").style.width = "0%"; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francesco Romano — Categorie</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1' fill='%23ffffff' opacity='0.4'/%3E%3Ccircle cx='150' cy='250' r='1.5' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='250' cy='100' r='1' fill='%23ffffff' opacity='0.5'/%3E%3Ccircle cx='80' cy='180' r='0.5' fill='%23ffffff' opacity='0.3'/%3E%3Ccircle cx='220' cy='190' r='2' fill='%23ffffff' opacity='0.2'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MENU HAMBURGER */
        .menu-btn {
            position: fixed;
            top: 25px;
            right: 30px;
            font-size: 30px;
            color: #f5f5f5;
            cursor: pointer;
            z-index: 100;
            transition: color 0.3s ease;
        }
        .menu-btn:hover { color: #a0a0a0; }
        .menu-overlay {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 200;
            top: 0;
            right: 0;
            background-color: rgba(5, 5, 5, 0.98);
            overflow-x: hidden;
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #a0a0a0;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .close-btn:hover { color: #f5f5f5; }
        .menu-content {
            display: flex;
            flex-direction: column;
            text-align: center;
            gap: 40px;
        }
        .menu-content a {
            text-decoration: none;
            font-size: 2rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 300;
            transition: color 0.3s ease;
        }
        .menu-content a:hover { color: #f5f5f5; }

        /* CATEGORIE */
        .back-home {
            align-self: flex-start;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
            transition: color 0.3s ease;
        }
        .back-home:hover { color: #f5f5f5; }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }
        .categories-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }
        .category-card {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #f5f5f5;
            transition: transform 0.4s ease;
            background-color: #141414; /* Sfondo di riserva se manca la foto */
        }
        .category-card:hover { transform: scale(1.01); }
        .category-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.55; /* Mostra di più l'immagine */
            transition: opacity 0.4s ease;
        }
        .category-card:hover img { opacity: 0.75; }
        .category-title {
            position: relative;
            z-index: 2;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0px 2px 12px rgba(0,0,0,0.9);
        }
        .category-card.wip {
            border: 1px dashed #333;
            cursor: default;
            background: transparent;
        }
        .category-card.wip .category-title { color: #444; text-shadow: none; }
    </style>
</head>
<body>

    <div class="menu-btn" onclick="apriMenu()">☰</div>

    <div id="menuOverlay" class="menu-overlay">
        <a href="javascript:void(0)" class="close-btn" onclick="chiudiMenu()">✕</a>
        <div class="menu-content">
            <a href="index.html">Home</a>
            <a href="portfolio.html">Le mie foto</a>
            <a href="contatti.html">Contatti</a>
        </div>
    </div>

    <a href="index.html" class="back-home">&larr; Home</a>

    <h1>Sezioni Portfolio</h1>

    <div class="categories-grid">
        <a href="primi-scatti.html" class="category-card">
            <img src="foto1.jpg" alt="Primi Scatti">
            <div class="category-title">Primi Scatti</div>
        </a>

        <a href="street-photography.html" class="category-card">
            <img src="foto2.jpg" alt="Street Photography">
            <div class="category-title">Street Photography</div>
        </a>

        <div class="category-card wip">
            <div class="category-title">Stay Tuned</div>
        </div>
    </div>

    <script>
        function apriMenu() { document.getElementById("menuOverlay").style.width = "100%"; }
        function chiudiMenu() { document.getElementById("menuOverlay").style.width = "0%"; }
    </script>
</body>
</html>
